<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f7931e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b9ede" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#1a1a2e"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Decorative tree nodes — suggests decision tree / random forest -->
  <circle cx="980" cy="180" r="18" fill="none" stroke="#f7931e" stroke-width="2" opacity="0.3"/>
  <circle cx="920" cy="280" r="14" fill="none" stroke="#f7931e" stroke-width="2" opacity="0.25"/>
  <circle cx="1040" cy="280" r="14" fill="none" stroke="#3b9ede" stroke-width="2" opacity="0.25"/>
  <circle cx="890" cy="370" r="10" fill="none" stroke="#f7931e" stroke-width="1.5" opacity="0.2"/>
  <circle cx="950" cy="370" r="10" fill="none" stroke="#f7931e" stroke-width="1.5" opacity="0.2"/>
  <circle cx="1010" cy="370" r="10" fill="none" stroke="#3b9ede" stroke-width="1.5" opacity="0.2"/>
  <circle cx="1070" cy="370" r="10" fill="none" stroke="#3b9ede" stroke-width="1.5" opacity="0.2"/>
  <line x1="980" y1="198" x2="920" y2="266" stroke="#f7931e" stroke-width="1" opacity="0.2"/>
  <line x1="980" y1="198" x2="1040" y2="266" stroke="#3b9ede" stroke-width="1" opacity="0.2"/>
  <line x1="920" y1="294" x2="890" y2="360" stroke="#f7931e" stroke-width="1" opacity="0.15"/>
  <line x1="920" y1="294" x2="950" y2="360" stroke="#f7931e" stroke-width="1" opacity="0.15"/>
  <line x1="1040" y1="294" x2="1010" y2="360" stroke="#3b9ede" stroke-width="1" opacity="0.15"/>
  <line x1="1040" y1="294" x2="1070" y2="360" stroke="#3b9ede" stroke-width="1" opacity="0.15"/>

  <!-- Eyebrow -->
  <rect x="80" y="120" width="50" height="3" fill="#f7931e" rx="2"/>
  <text x="80" y="108" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#6b7280">TUTORIAL SERIES</text>

  <!-- Main title -->
  <text x="80" y="220" font-family="Inter, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Scikit-Learn</text>
  <text x="80" y="305" font-family="Inter, sans-serif" font-size="76" font-weight="800" fill="#f7931e">in One Post</text>

  <!-- Subtitle -->
  <text x="80" y="370" font-family="Inter, sans-serif" font-size="22" fill="#9ca3af">The library that taught a generation to think in machines</text>

  <rect x="80" y="410" width="1040" height="1" fill="#2a2a3e"/>

  <!-- Code snippet pill -->
  <rect x="80" y="435" width="310" height="40" rx="8" fill="#0d0d1a"/>
  <text x="100" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#f7931e">model</text>
  <text x="148" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#ffffff">.</text>
  <text x="154" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#3b9ede">fit</text>
  <text x="177" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#ffffff">(X_train, y_train)</text>

  <rect x="404" y="435" width="270" height="40" rx="8" fill="#0d0d1a"/>
  <text x="424" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#f7931e">model</text>
  <text x="472" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#ffffff">.</text>
  <text x="478" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#3b9ede">predict</text>
  <text x="529" y="460" font-family="JetBrains Mono, monospace" font-size="14" fill="#ffffff">(X_test)</text>

  <!-- Author/site -->
  <text x="1120" y="590" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3b9ede" text-anchor="end">henrybernreuter.com</text>
